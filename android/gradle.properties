org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.parallel=false
# -Dfile.encoding=UTF-8 不能只加在 org.gradle.jvmargs 上：Kotlin 编译守护进程是独立 JVM，
# 不继承那份参数。在中文 Windows 上它会按平台默认编码 GBK 读源文件，于是所有中文字面量
# 被静默读错 —— 例如 '“'(UTF-8 E2 80 9C) 会被当成 GBK 读成 U+9225 加一个残字节。
# 症状很隐蔽：编译不报错，只是运行时中文变乱码，且是否出现取决于当时用的是哪个守护进程。
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
