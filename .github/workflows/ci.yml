name: CI 质量关卡

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: 桌面端类型检查与测试
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 桌面端类型检查
        run: |
          npx tsc --noEmit -p tsconfig.main.json
          npx tsc --noEmit -p tsconfig.renderer.json
          npx tsc --noEmit -p tsconfig.node.json

      - name: 桌面端单元测试
        run: npm test

      - name: 桌面端生产构建
        run: npm run build

      - name: 运行关键 verify 脚本
        run: |
          node scripts/verify-data-integrity.mjs
          node scripts/verify-sync-schema.mjs

  android-native:
    name: Android Native (Build + Test + Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint Check
        run: ./gradlew :app:lintDebug
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
      - name: Compile Instrumented Tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin
        # Note: Running instrumented tests requires a device/emulator.
        # Migration tests should be run locally on a connected device.

  # ---- Android Room 迁移测试 ----
  # 已转正为必过 job（已移除 continue-on-error）。
  # 转正依据：run 31087310807 首次在 CI 真实执行即成功，模拟器正常启动、Room 6→7 与 1→7 迁移用例通过，无模拟器环境性失败。
  # 注：本仓库 GitHub Actions 不支持 job 级 retry 字段（加上会导致 workflow file issue，实测 7f79f36/d9c7c1f 两次失败），故未加自动重试；首发即成功且无模拟器环境失败观察，后续若发现偶发抖动再评估兼容重试方案（如 composite action）。
  android-migration-tests:
    name: Android Room 迁移测试（模拟器，必过）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      # GitHub Actions Linux runner 支持嵌套虚拟化，需开启 KVM（见 android-emulator-runner README）
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/adb*
            ~/.android/debug.keystore
            ~/.android/cache
            ~/.android/cache.lock
            ~/.android/avd/*
            ~/.android/*.ini
          key: avd-30-migration-tests
      - name: Create AVD and generate emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: android
          channel: stable
          script: echo "Generated AVD snapshot for caching."
      - name: 运行 Room 迁移测试（connectedDebugAndroidTest）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          channel: stable
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.creationreadingassistant.data.local.AppDatabaseMigrationTest
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-migration-test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
