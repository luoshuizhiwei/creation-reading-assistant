name: CI 质量关卡

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: 桌面端类型检查与测试
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 桌面端类型检查
        run: |
          npx tsc --noEmit -p tsconfig.main.json
          npx tsc --noEmit -p tsconfig.renderer.json
          npx tsc --noEmit -p tsconfig.node.json

      - name: 桌面端单元测试
        run: npm test

      - name: 桌面端生产构建
        run: npm run build

      - name: 运行关键 verify 脚本
        run: |
          node scripts/verify-data-integrity.mjs
          node scripts/verify-sync-schema.mjs

  android-native:
    name: Android Native (Build + Test + Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint Check
        run: ./gradlew :app:lintDebug
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
      - name: Compile Instrumented Tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin
        # Note: Running instrumented tests requires a device/emulator.
        # Migration tests should be run locally on a connected device.

  # ---- Android Room 迁移测试 ----
  # 必过 job（已移除 continue-on-error），按用户决策走"深度优化保必过"路线。
  # 转正依据：run 31087310807 首次在 CI 真实执行即成功，Room 6→7 与 1→7 迁移用例通过。
  # 磁盘不足处置（run 31093576882 / 31095636717 均 No space left on device）：
  #   ① 禁用 gradle 缓存（gradle-home-cache-enabled: false）省 ~3-8GB 峰值占用；
  #   ② 移除 AVD cache（每次重建 AVD，省缓存占用，提高波动磁盘下的成功率）；
  #   ③ 手动清理预装大目录（dotnet/CodeQL/ghcup/docker）真实释放根分区空间——
  #      替代 maximize-build-space（实测它在该 runner 用 LVM 把盘撑到 100%，适得其反）。
  #   注：GitHub free runner 磁盘占用波动（启动 50%~80% 满），以上措施提高成功率但非 100% 保证；
  #       本仓库亦不支持 job 级 retry 字段（加它会致 workflow file issue，实测 7f79f36/d9c7c1f）。
  android-migration-tests:
    name: Android Room 迁移测试（模拟器，必过）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: 清理预装大目录（释放根分区空间，规避 GitHub free runner 磁盘满）
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/ghcup 2>/dev/null || true
          sudo docker system prune -a -f 2>/dev/null || true
          echo "--- 清理后磁盘 ---"
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-enabled: false # 深度优化：不恢复/保存 gradle 缓存，省 ~3-8GB 峰值磁盘占用
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      # GitHub Actions Linux runner 支持嵌套虚拟化，需开启 KVM（见 android-emulator-runner README）
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create AVD and generate emulator snapshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: android
          channel: stable
          script: echo "Generated AVD snapshot for caching."
      - name: 运行 Room 迁移测试（connectedDebugAndroidTest）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          channel: stable
          script: |
            for i in 1 2 3; do
              if ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.creationreadingassistant.data.local.AppDatabaseMigrationTest; then
                break
              fi
              echo "::warning::迁移测试第 $i 次失败，15s 后重试（吸收模拟器偶发抖动）"
              sleep 15
            done
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-migration-test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
