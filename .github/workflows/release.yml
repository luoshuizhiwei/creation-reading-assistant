name: 发布版本

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-assets:
    name: 构建 Windows 和 Android 发布包
    runs-on: windows-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装桌面端依赖
        run: npm ci

      - name: 安装手机端依赖
        run: npm ci --prefix mobile

      - name: 检查发布流程文件
        run: npm run verify:release-readiness

      - name: 运行桌面端完整 Beta 门禁
        run: npm run verify:beta

      - name: 构建电脑端安装包和免安装目录
        run: npm run dist:beta:installer

      - name: 验证电脑端打包产物
        run: npm run verify:beta:release

      - name: 验证电脑端安装包发布配置
        run: npm run verify:installer-release -- --require-artifact

      - name: 构建手机端网页资源
        run: npm run mobile:build

      - name: 同步 Capacitor Android 工程
        shell: pwsh
        run: |
          Push-Location mobile
          npx cap sync android
          Pop-Location

      - name: 构建 Android 测试 APK
        shell: pwsh
        run: |
          Push-Location mobile\android
          .\gradlew.bat assembleDebug
          Pop-Location

      - name: 整理发布下载文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path release-beta\win-unpacked\* -DestinationPath release-artifacts\creation-reading-assistant-windows-win-unpacked.zip -Force
          $installer = Get-ChildItem release-beta -Filter "创作阅读助手-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "没有找到 Windows 安装包" }
          Copy-Item $installer.FullName release-artifacts\creation-reading-assistant-windows-setup.exe -Force
          Copy-Item mobile\android\app\build\outputs\apk\debug\app-debug.apk release-artifacts\creation-reading-assistant-mobile-debug.apk -Force
          Get-ChildItem release-artifacts -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash)  $($_.Name)"
            } |
            Set-Content -Encoding UTF8 release-artifacts\SHA256SUMS.txt

      - name: 上传工作流构建产物
        uses: actions/upload-artifact@v4
        with:
          name: creation-reading-assistant-release-assets
          path: release-artifacts/*
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 创作阅读助手 ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: true
          files: |
            release-artifacts/creation-reading-assistant-windows-win-unpacked.zip
            release-artifacts/creation-reading-assistant-windows-setup.exe
            release-artifacts/creation-reading-assistant-mobile-debug.apk
            release-artifacts/SHA256SUMS.txt
