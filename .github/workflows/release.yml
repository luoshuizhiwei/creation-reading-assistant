name: 发布版本

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# P0-A3 TODO: 原生 android/ Release APK 迁移尚未完成。
# 当前工作流只构建桌面端（Windows 安装版 + 免安装版）。
# 完成 P0-A3 后，在此恢复原生 android/ 的签名、版本号、R8、源码包、
# SHA-256 和更新清单，并移除本注释。
# 旧 mobile/android Capacitor APK 的构建与上传已在 P0-A2（2026-07-29）退役。

jobs:
  build-release-assets:
    name: 构建 Windows 正式发布包
    runs-on: windows-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 准备版本号
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "CRA_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 安装依赖
        run: npm ci

      - name: 运行发布门禁
        run: |
          npm run verify:release-readiness
          npm run verify:beta

      - name: 构建 Windows 安装版与免安装版
        run: npm run dist:beta:installer

      - name: 验证 Windows 打包产物
        run: |
          npm run verify:beta:release
          npm run verify:installer-release -- --require-artifact

      - name: 整理下载文件与校验和
        shell: pwsh
        run: |
          $version = $env:CRA_RELEASE_VERSION
          # GPL 许可证文件（来自已归档的 Capacitor 历史，保留用于源码对应）
          Copy-Item archives/frozen-mobile/LICENSE release-artifacts/LICENSE -Force
          Copy-Item archives/frozen-mobile/NOTICE.md release-artifacts/NOTICE.md -Force
          Copy-Item archives/frozen-mobile/THIRD_PARTY_NOTICES.md release-artifacts/THIRD_PARTY_NOTICES.md -Force

          Compress-Archive -Path release-beta/win-unpacked/* -DestinationPath "release-artifacts/creation-reading-assistant-$version-windows-x64-portable.zip" -Force
          $installer = Get-ChildItem release-beta -Filter "创作阅读助手-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "没有找到 Windows 安装包" }
          Copy-Item $installer.FullName "release-artifacts/creation-reading-assistant-$version-windows-x64-setup.exe" -Force
          Copy-Item CHANGELOG.md release-artifacts/RELEASE_NOTES_zh-CN.md -Force

          Get-ChildItem release-artifacts -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash)  $($_.Name)"
            } | Set-Content -Encoding utf8 release-artifacts/SHA256SUMS.txt

      - name: 上传工作流构建产物
        uses: actions/upload-artifact@v4
        with:
          name: creation-reading-assistant-release-assets
          path: release-artifacts/*
          if-no-files-found: error

      - name: 发布到公开下载仓库
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "缺少 PUBLIC_RELEASE_TOKEN，不能发布到公开下载仓库。" }
          gh release create $env:GITHUB_REF_NAME --repo luoshuizhiwei/creation-reading-assistant-releases --title "创作阅读助手 $env:GITHUB_REF_NAME" --notes-file release-artifacts/RELEASE_NOTES_zh-CN.md release-artifacts/*
