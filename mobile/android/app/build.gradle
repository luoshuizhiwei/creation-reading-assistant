def mobilePackage = new groovy.json.JsonSlurper().parse(file("../../package.json"))

def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: project.findProperty(propertyName)
}
def releaseStoreFile = signingValue("CRA_ANDROID_KEYSTORE_FILE", "craAndroidKeystoreFile")
def releaseStorePassword = signingValue("CRA_ANDROID_KEYSTORE_PASSWORD", "craAndroidKeystorePassword")
def releaseKeyAlias = signingValue("CRA_ANDROID_KEY_ALIAS", "craAndroidKeyAlias")
def releaseKeyPassword = signingValue("CRA_ANDROID_KEY_PASSWORD", "craAndroidKeyPassword")
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def hasAnyReleaseSigningValue = releaseSigningValues.any { it != null && !it.toString().isBlank() }
def hasCompleteReleaseSigning = releaseSigningValues.every { it != null && !it.toString().isBlank() }

if (hasAnyReleaseSigningValue && !hasCompleteReleaseSigning) {
    throw new GradleException("Android 发布签名配置不完整。请同时提供 keystore 文件、store password、key alias 和 key password。")
}

apply plugin: 'com.android.application'

android {
    namespace "local.creationReadingAssistant.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "local.creationReadingAssistant.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 27
        versionName mobilePackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasCompleteReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasCompleteReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        dataBinding true
    }
    dataBinding {
        enabled = true
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestsPublishableRelease = graph.allTasks.any { task ->
        task.project == project && task.name in ["assembleRelease", "bundleRelease", "packageRelease"]
    }
    if (requestsPublishableRelease && !hasCompleteReleaseSigning) {
        throw new GradleException(
            "拒绝生成未签名 Android Release 包。请通过 CRA_ANDROID_KEYSTORE_* 环境变量或 craAndroid* Gradle 属性提供签名配置。"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':legado-reader-core')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
